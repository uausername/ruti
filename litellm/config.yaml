# Hand-written half of the proxy config. The local models are NOT listed here --
# `ruti models sync` enumerates them from disk into models.generated.yaml, and each
# one is named after the identifier ruti passes to `lms load --identifier`. That
# pairing is what lets a model swap happen without restarting the proxy.
#
# Note that LiteLLM extends list-valued keys across an include but *replaces* dict
# ones, so router_settings and litellm_settings must live here and only here.
include:
  - providers.generated.yaml
  - models.generated.yaml

model_list:
  # Two entries share one model_name so the router rotates between the API keys
  # and cools down whichever one hits its rate limit.
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_KEY_A
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_KEY_B

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 1
  cooldown_time: 60
  # A 429 from a free OpenRouter model is its provider throttling for a few seconds,
  # not a dead backend. With one deployment per alias, cooling it down after the first
  # one left "no deployments available" for a minute -- and, while a default fallback
  # existed, sent the rest of the run to Gemini. So a rate limit is retried on the same
  # model with a pause, and takes five of them before the cool-down.
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 5
  retry_policy:
    RateLimitErrorRetries: 4
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 2
  retry_after: 5

litellm_settings:
  num_retries: 2
  request_timeout: 120
  # No default_fallbacks. `["gemini-flash"]` used to sit here for every deployment,
  # and it answered in the alias's name: five delegations to `laguna-s-2.1` and `free`
  # were all done by gemini-2.5-flash, reported as the alias, possibly on a paid key
  # past free mode. The old `lm-studio-local` alias had failed the same way. A local
  # model gains nothing from it either -- the reason to have one is no internet, when
  # Gemini cannot answer anyway -- and `delegate` loads local models on demand. An
  # alias that cannot answer now fails with its own error; Gemini stays available as
  # the explicit `gemini-flash` alias for whoever picks it.
  # One line per completion in %LOCALAPPDATA%\ruti\usage.jsonl naming the model that
  # really answered. For a router alias such as pareto-code that is the only place the
  # router's pick survives: the proxy rewrites `model` in every response to the alias
  # the client asked for. `ruti delegate` reads it back -- see ruti_usage.py.
  callbacks: ruti_usage.handler
